# 新作の候補を集める所(scripts/collect.py)。2026-11-04 本人「新発売のガジェットを1日1件」「国内と海外は半々」
# region: jp = 日本の発表(買うボタンが置ける)/ world = 海外の発表
# PR TIMES の一覧は直近1時間半ぶんしか載らないので、collect.yml が30分おきに回す
feeds:
  - {name: PR TIMES, region: jp, url: "https://prtimes.jp/index.rdf"}
  - {name: PC Watch, region: jp, url: "https://pc.watch.impress.co.jp/data/rss/1.0/pcw/feed.rdf"}
  - {name: AV Watch, region: jp, url: "https://av.watch.impress.co.jp/data/rss/1.0/avw/feed.rdf"}
  - {name: ITmedia PC USER, region: jp, url: "https://rss.itmedia.co.jp/rss/2.0/pcuser.xml"}
  - {name: ASCII.jp PC, region: jp, url: "https://ascii.jp/pc/rss.xml"}
  - {name: マイナビニュース PC, region: jp, url: "https://news.mynavi.jp/rss/digital/pc"}
  - {name: GetNavi web, region: jp, url: "https://getnavi.jp/feed/"}
  - {name: Yanko Design, region: world, url: "https://www.yankodesign.com/feed/"}
  - {name: Notebookcheck, region: world, url: "https://www.notebookcheck.net/News.152.100.html?type=rss&view=all"}
  - {name: TechPowerUp, region: world, url: "https://www.techpowerup.com/rss/news"}
  - {name: Gizmochina, region: world, url: "https://www.gizmochina.com/feed/"}
  - {name: Tom's Hardware, region: world, url: "https://www.tomshardware.com/feeds/all"}

