# 新作の候補を集める所(scripts/collect.py)。2026-11-04 本人「新発売のガジェットを1日1件」「国内と海外は半々」
# region: jp = 日本の発表(買うボタンが置ける)/ world = 海外の発表(英語)/ cn = 中国の発表(中国語。記事では origin: world)
# PR TIMES の一覧は直近1時間半ぶんしか載らないので、collect.yml が30分おきに回す
feeds:
  - {name: PR TIMES, region: jp, url: "https://prtimes.jp/index.rdf"}
  - {name: PC Watch, region: jp, url: "https://pc.watch.impress.co.jp/data/rss/1.0/pcw/feed.rdf"}
  - {name: AV Watch, region: jp, url: "https://av.watch.impress.co.jp/data/rss/1.0/avw/feed.rdf"}
  - {name: ITmedia PC USER, region: jp, url: "https://rss.itmedia.co.jp/rss/2.0/pcuser.xml"}
  - {name: ASCII.jp PC, region: jp, url: "https://ascii.jp/pc/rss.xml"}
  - {name: マイナビニュース PC, region: jp, url: "https://news.mynavi.jp/rss/digital/pc"}
  - {name: GetNavi web, region: jp, url: "https://getnavi.jp/feed/"}
  - {name: Yanko Design, region: world, url: "https://www.yankodesign.com/feed/"}
  - {name: Notebookcheck, region: world, url: "https://www.notebookcheck.net/News.152.100.html?type=rss&view=all"}
  - {name: TechPowerUp, region: world, url: "https://www.techpowerup.com/rss/news"}
  - {name: Gizmochina, region: world, url: "https://www.gizmochina.com/feed/"}
  - {name: Tom's Hardware, region: world, url: "https://www.tomshardware.com/feeds/all"}
  # 11/9 足した(本人「海外、主に米国と中国のシロモノを」)。上の総合ニュースは CPU・スマホが中心で、11/5 以降の海外の候補がほぼ0件だったため
  - {name: The Verge, region: world, url: "https://www.theverge.com/rss/index.xml"}
  - {name: Engadget, region: world, url: "https://www.engadget.com/rss.xml"}
  - {name: Dezeen テクノロジー, region: world, url: "https://www.dezeen.com/technology/feed/"}
  - {name: Design Milk テクノロジー, region: world, url: "https://design-milk.com/category/technology/feed/"}
  - {name: Keychron ブログ, region: world, url: "https://www.keychron.com/blogs/news.atom"}
  - {name: YUNZII ブログ, region: world, url: "https://yunzii.com/blogs/news.atom"}
  - {name: Satechi ブログ, region: world, url: "https://satechi.net/blogs/news.atom"}
  - {name: IT之家, region: cn, url: "https://www.ithome.com/rss/"}
  - {name: 少数派, region: cn, url: "https://sspai.com/feed"}
  - {name: cnBeta, region: cn, url: "https://www.cnbeta.com.tw/backend.php"}
  # 試して入れなかった所(11/9): Shopify の新着一覧(collections/all.atom・products.json)はどのブランドも 429 で断られる。
  # Lofree・MelGeek・UGREEN のブログは何か月も更新なし、NuPhy は 429、Akko・AULA・Baseus は RSS なし、Kickstarter は 406

