site:
  title: Cozy Desk
  tagline: 白と淡い色の、デスク周りのガジェット
  header_sub: 白デスク・淡色デスクのガジェット  # ヘッダーのロゴの右(スマホは下)。検索で探される言葉を入れる(2026-11-14 本人)
  description: 白デスク・淡色デスクに合う、白と淡い色のガジェットを種類ごとに。海外の新作と、日本で今買えるものを、色の名前・値段・日本で買えるかまで確かめて載せています。
  base_url: https://cozydesk.gadgetterminal.com
  author: Star Platinum LLC
  contact_email: info@gadgetterminal.com
  press_email: press@gadgetterminal.com  # メーカー・広報の方へ(/media/)の連絡先。GT と同じ受け口
  x_account: "cozy_desk"
  copyright_from: 2026
  # Cloudflare Web Analytics のトークン。空なら出さない
  # 11/8 GT と同じトークン(司令塔はアドレスで分けて数える)
  cf_analytics_token: "a114276e3ee147cc9bcdc2edf684b9fc"
  # GA4(2026-11-01)。空ならタグも「アクセス解析について」も出ない
  analytics_id: "G-PR6B79GV7B"
  search_console_verification: ""

# 紹介リンク(もしも)。{url} に楽天・Amazon・Yahoo の検索ページのURL(エンコード済み)が入る。GT と同じ書き方
# もしもでこのサイトを登録して提携が通るまでは空のままにする
# (GT 用の a_id をこのサイトに貼らない。もしもの規約でサイトごとの登録が要る)。
# 空のあいだは、ふつうの検索ページへのリンクを出し、「広告を含みます」の表示も出さない。
affiliate:
  rakuten: ""
  amazon: ""
  yahoo: ""
  # A8.net のメーカー日本公式ストア(2026-11-08〜)。A8 で Cozy Desk をサイトとして登録し、そのサイトで提携した店だけ入れる
  # (GT の a8mat をこのサイトに貼らない。サイトごとに別)。書き方は GT と同じ:
  #   名前: "https://px.a8.net/svt/ejp?a8mat=<Cozy Desk 用>&a8ejpredirect={url}"   … 商品ページへ飛ばせる店
  #   名前: "https://px.a8.net/svt/ejp?a8mat=<Cozy Desk 用>"                        … トップ行きだけの店
  # 記事の物には official: {store: 名前, url: 日本向けの商品ページ} と書く。空の店はボタンを出さない。
  # 公開後は A8 の「広告掲載URL管理」に記事の URL を出す決まり
  a8:
    # 2026-11-08 Cozy Desk(A8 の副サイト)で提携。飛び先は各店の日本向けページの中だけ
    edifier: "https://px.a8.net/svt/ejp?a8mat=4BGGBE+6G73H6+5BV8+BW8O2&a8ejpredirect={url}"     # 10%・www.edifier.jp
    pixio: "https://px.a8.net/svt/ejp?a8mat=4BGGBE+6HDYOQ+XTI+1BM8YQ&a8ejpredirect={url}"      # 5%・pixiogaming.jp(Hamee)
    flexispot: "https://px.a8.net/svt/ejp?a8mat=4BGGBE+6M5FIY+3TA8+BW8O2&a8ejpredirect={url}"  # 2.5%・flexispot.jp
    # 審査中: Wpc.(s00000026600001)。Razer は GT から申請中

# 種類。並び順がそのままメニューの順になる
categories:
  - slug: desk
    name: デスク
    sub: 天板・昇降デスク
    eyebrow: 白デスクの土台に   # 種類ページの題の上の小さい見出し(11/11 本人。「ガジェット女子」とは名乗らず、置き場所で語る)
    lead: 部屋の印象がいちばん変わる、白い天板と白い脚のデスク。高さを変えられる昇降デスクも。
    # 机は色より横幅と形で選ぶので、種類ページの軸を色から変える(物の側は products の facets: に書く)
    facets:
      - {key: width, name: 横幅, values: [100cm前後, 120cm前後, 140cm前後, 160cm以上]}
      - {key: shape, name: 形,   values: [平机, 昇降, L字, 折りたたみ]}
  - {slug: chair,    name: 椅子,       sub: 白いメッシュ・ゲーミング,  eyebrow: 白デスクの前に置きたい椅子, lead: 後ろ姿まで白くそろう、白いメッシュの椅子と、白・淡い色のゲーミングチェア。}
  - {slug: pc,       name: PC,         sub: 白いケース・光るファン,    eyebrow: 机の上の主役に, lead: ガラス越しに中まで白く見せられる PC ケースと、淡い色に光るファン。}
  - {slug: monitor,  name: モニター,   sub: 白い本体・モニターアーム,  eyebrow: 白デスクに置きたいモニター, lead: 背中や足まで白いモニターと、白いモニターアーム。}
  - {slug: mouse,    name: マウス,     sub: 白・ベージュ・くすみ色,    eyebrow: 手元をやさしい色に, lead: 白・ベージュ・くすみ色のマウスと、色を合わせられるマウスパッド。}
  - {slug: keyboard, name: キーボード, sub: 白・ピンク・テンキー,      eyebrow: 机でいちばん目に入る所に, lead: 白・ピンク・ベージュのキーボードとテンキー。}
  - {slug: speaker,  name: スピーカー, sub: 白い PC スピーカー,        eyebrow: 出しっぱなしでも絵になる, lead: 机の上に置いても浮かない、白い本体の PC スピーカー。}
  - {slug: gear,     name: 周辺機器,   sub: ヘッドホン・マイク・カメラ, eyebrow: 白デスクに置きたい周辺機器, lead: 机の上に出しておきたくなる、白と淡い色のヘッドホン・マイク・Web カメラ・充電器など。}
  - {slug: interior, name: インテリア, sub: 照明・棚・配線かくし,      eyebrow: 白デスクの空気をつくる, lead: 間接照明・デスクライト・棚・配線かくし・植物。}

